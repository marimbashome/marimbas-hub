# Marimbas cross-cutting rollout 2026-05 — Lighthouse CI
# Corre auditorias de solo lectura sobre el preview de Vercel de cada PR.
# NO toca produccion. Hoy NO bloquea merges (continue-on-error: true).
#
# Para que bloquee, cambiar `continue-on-error: true` -> `false`.
#
# 2026-08-14 — ARREGLO: este workflow nunca midio nada. La URL se declaraba dentro de
# lighthouserc.json como "${LHCI_TARGET_URL}", pero lhci NO interpola variables de entorno
# dentro de un config JSON: recibia esa cadena literal y moria con INVALID_URL. 72 de 72
# corridas ejecutadas fallaron en 7 repos. La URL ahora entra por bandera --collect.url.

name: Lighthouse CI

on:
  deployment_status: {}
  workflow_dispatch: {}

permissions:
  contents: read
  pull-requests: write

jobs:
  lighthouse:
    if: github.event.deployment_status.state == 'success' && github.event.deployment.environment == 'Preview'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    continue-on-error: true   # WARN-only mode for the first month. Switch to false after baseline established.

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Lighthouse CI
        run: npm i -g @lhci/cli@0.14.x

      - name: Run Lighthouse against preview URL
        env:
          LHCI_TARGET_URL: ${{ github.event.deployment_status.target_url }}
          VERCEL_BYPASS: ${{ secrets.VERCEL_AUTOMATION_BYPASS_SECRET }}
        run: |
          set -euo pipefail

          if [ ! -f lighthouserc.json ]; then
            echo "No lighthouserc.json found at repo root; skipping."
            exit 0
          fi

          # 1) Sin URL no hay nada que medir. Fallar aqui, nunca seguir en silencio.
          if [ -z "${LHCI_TARGET_URL:-}" ]; then
            echo "::error::LHCI_TARGET_URL viene vacia; este workflow solo puede medir un deploy de preview real."
            exit 1
          fi

          # 2) Si el repo tiene el secreto de excepcion de Vercel, se usa para entrar al preview.
          LHCI_ARGS=(--collect.url="$LHCI_TARGET_URL" --config=./lighthouserc.json)
          CURL_ARGS=(-sSL -o /dev/null -w '%{url_effective}')
          if [ -n "${VERCEL_BYPASS:-}" ]; then
            LHCI_ARGS+=(--collect.settings.extraHeaders="{\"x-vercel-protection-bypass\":\"${VERCEL_BYPASS}\"}")
            CURL_ARGS+=(-H "x-vercel-protection-bypass: ${VERCEL_BYPASS}")
            echo "Usando la excepcion de proteccion de Vercel para entrar al preview."
          fi

          # 3) Guardarrail: comprobar que la URL sirve LA APP y no un muro de acceso.
          #    Sin esto, Lighthouse mide la pantalla de login de Vercel y devuelve puntajes
          #    altos y reales de la pagina equivocada: un verde que miente.
          FINAL_URL=$(curl "${CURL_ARGS[@]}" "$LHCI_TARGET_URL" || echo "")
          case "$FINAL_URL" in
            *vercel.com/login*|*sso-api*)
              echo "::error::El preview esta protegido y manda a la pantalla de acceso de Vercel ($FINAL_URL). Lighthouse mediria esa pantalla y no la app. Para medir previews: activar 'Protection Bypass for Automation' en el proyecto de Vercel y guardar el valor como secreto VERCEL_AUTOMATION_BYPASS_SECRET en este repo."
              exit 1
              ;;
            "")
              echo "::error::No se pudo abrir $LHCI_TARGET_URL para comprobar que responde."
              exit 1
              ;;
          esac

          echo "Midiendo: $LHCI_TARGET_URL (responde en: $FINAL_URL)"
          lhci autorun "${LHCI_ARGS[@]}"
