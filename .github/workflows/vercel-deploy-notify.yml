name: Vercel deploy ERROR → Slack

# Fires on Vercel's `deployment_status` event (delivered by the Vercel↔GitHub
# integration), NOT on every push. The event already carries the FINAL build
# state, so there is zero waiting/polling: the job only does real work when a
# deploy reaches an ERROR state, and finishes in a few seconds.
#
# This replaces the previous push-triggered version that ran `sleep 100` + a
# retry loop on EVERY push to main — billing ~3-5 GitHub Actions minutes per push
# just to wait for the build. Same alert, same Slack #ops-core path, same
# Supabase edge function `vercel-deploy-error-notify` — only the trigger and the
# waiting changed.
#
# Why this exists: Vercel's built-in email notifications missed the 3 builds
# that took book.marimbashome.com off the QA pass for 6 weeks (Mar 24 → May 5).
# This workflow is the canary for `website` and `marimbas-guest-app`. It now also
# catches failed PREVIEW builds at no extra cost, since the job only runs on error.
#
# Manual smoke test: Actions tab → this workflow → "Run workflow" (workflow_dispatch).
# It looks up the latest deploy for HEAD and reports its state; it only sends a
# Slack alert if that deploy actually ERRORed — a safe way to confirm the Vercel
# token + API path still work.

on:
  deployment_status: {}
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  notify-on-error:
    # Only spend a runner on an actual failure (or a manual smoke test).
    if: >-
      github.event_name == 'workflow_dispatch' ||
      github.event.deployment_status.state == 'error' ||
      github.event.deployment_status.state == 'failure'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      # El candado se prueba a si mismo antes de usarse. Siembra el caso que el
      # cambio del 2026-09-17 arregla: un despliegue que SOLO trae `readyState`
      # (sin `state`) y esta en ERROR. Si el armador del mensaje volviera a leer
      # `.state` a secas, a Slack llegaria `deploy_state: null` y este paso se
      # pone rojo. Corre en segundos y solo cuando el job ya iba a correr.
      - name: Autoprueba del armador del mensaje
        run: |
          set -euo pipefail
          FIXTURE='{"uid":"dpl_prueba","url":"prueba.vercel.app","readyState":"ERROR","meta":{"githubCommitMessage":"m","githubCommitAuthorName":"a"}}'
          STATE=$(echo "$FIXTURE" | jq -r '.state // .readyState // "UNKNOWN"')
          OUT=$(echo "$FIXTURE" | jq -r --arg repo r --arg sha s --arg state "$STATE" \
            '{repo: $repo, commit_sha: $sha,
              commit_message: (.meta.githubCommitMessage // ""),
              commit_author: (.meta.githubCommitAuthorName // ""),
              deploy_id: (.uid // .id), deploy_state: $state, deploy_url: .url,
              inspector_url: (.inspectorUrl // "")} | .deploy_state')
          if [ "$OUT" != "ERROR" ]; then
            echo "::error::Autoprueba: un deploy con solo readyState=ERROR produjo deploy_state='$OUT' (se esperaba ERROR). El aviso a Slack mentiria sobre el estado."
            exit 1
          fi
          echo "Autoprueba OK: readyState=ERROR sin 'state' llega como deploy_state=ERROR."

      - name: Check Vercel deploy state and alert Slack if ERROR
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          MARIMBAS_ADMIN_TOKEN: ${{ secrets.MARIMBAS_ADMIN_TOKEN }}
          TEAM_ID: team_Fg1MXTOak1GcwELAM4lCDpsS
          PROJECT_ID: prj_PWqcXFu1BSpooxA1svYJY2OwbgnE
          SHA: ${{ github.sha }}
          REPO: ${{ github.event.repository.name }}
        run: |
          set -e

          # 2026-09-17: sigue pagination.next de la API de Vercel en vez de un
          # limite fijo (antes limit=100 sin loop) — cierra el caso de mas de 100
          # deploys entre el evento y esta corrida. Tope de 10 paginas (~1000 deploys).
          DEPLOY=""
          UNTIL=""
          PAGES_CHECKED=0
          for i in $(seq 1 10); do
            URL="https://api.vercel.com/v6/deployments?teamId=$TEAM_ID&projectId=$PROJECT_ID&limit=100"
            if [ -n "$UNTIL" ]; then
              URL="${URL}&until=${UNTIL}"
            fi
            RESP=$(curl -s -H "Authorization: Bearer $VERCEL_TOKEN" "$URL")
            PAGES_CHECKED=$i

            # Find the deployment matching this commit SHA.
            DEPLOY=$(echo "$RESP" | jq -c --arg sha "$SHA" \
              'first(.deployments[] | select(.meta.githubCommitSha == $sha)) // empty')

            if [ -n "$DEPLOY" ]; then
              break
            fi

            NEXT=$(echo "$RESP" | jq -r '.pagination.next // empty')
            if [ -z "$NEXT" ] || [ "$NEXT" = "null" ]; then
              break
            fi
            UNTIL="$NEXT"
          done

          if [ -z "$DEPLOY" ]; then
            # Un canario que no encuentra la jaula NO puede salir en verde. En un
            # `deployment_status` real este camino significa que hubo un deploy y no
            # supimos su estado: justo el silencio que este workflow existe para
            # romper. Se pone rojo para que se vea en la pestana Actions.
            # En el arranque a mano (workflow_dispatch) sigue siendo aviso: ahi es
            # normal que el HEAD del momento no tenga deploy propio.
            if [ "${GITHUB_EVENT_NAME:-}" = "workflow_dispatch" ]; then
              echo "::warning::No Vercel deployment matched SHA $SHA (prueba manual) — no alert sent."
              exit 0
            fi
            echo "::error::Hubo un deployment_status pero ningun despliegue de Vercel coincide con SHA $SHA en $PAGES_CHECKED pagina(s) (paginado con pagination.next). No se pudo saber si fallo."
            exit 1
          fi

          STATE=$(echo "$DEPLOY" | jq -r '.state // .readyState // "UNKNOWN"')
          echo "Vercel deploy state for $SHA: $STATE"

          if [ "$STATE" != "ERROR" ]; then
            echo "::notice::state=$STATE (not ERROR) — no Slack alert."
            exit 0
          fi

          # Build the payload exactly like the previous workflow (same edge-function
          # contract). Commit message/author come from Vercel meta because the
          # deployment_status event has no head_commit. jq handles escaping safely.
          # `deploy_state` sale de $STATE, que es el valor que ESTE workflow ya evaluo
          # arriba con su cadena de respaldo. Antes se volvia a leer `.state` a secas:
          # medido el 2026-09-17 contra la API real, hoy v6 devuelve `state` y
          # `readyState` iguales en los 84 despliegues del proyecto, asi que no falla —
          # pero el dia que Vercel deje solo `readyState` (el nombre canonico), la
          # alerta se disparaba por ERROR y a Slack llegaba deploy_state: null.
          # Un solo origen para el estado: el que se juzgo es el que se reporta.
          PAYLOAD=$(echo "$DEPLOY" | jq \
            --arg repo "$REPO" \
            --arg sha "$SHA" \
            --arg state "$STATE" \
            '{repo: $repo,
              commit_sha: $sha,
              commit_message: (.meta.githubCommitMessage // ""),
              commit_author: (.meta.githubCommitAuthorName // ""),
              deploy_id: (.uid // .id),
              deploy_state: $state,
              deploy_url: .url,
              inspector_url: (.inspectorUrl // "")}')

          curl -fsS -X POST \
            -H "Authorization: Bearer $MARIMBAS_ADMIN_TOKEN" \
            -H "Content-Type: application/json" \
            -d "$PAYLOAD" \
            https://xqjjdopwinljrnxexpwd.supabase.co/functions/v1/vercel-deploy-error-notify

          echo "::notice::Slack alert sent to #ops-core for ERROR deploy."
